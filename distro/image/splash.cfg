# OpenShell Native: the boot splash, as on OpenShell Live. GRUB draws
# splash.png (make-splash.py: Live's wordmark and bar on the desktop's
# near-black) while it loads the system, and hands the screen to the kernel as
# it is (gfxpayload=keep). The EFI stub stays quiet and the kernel keeps what is
# on the screen, so the splash holds until the desktop's boot screen, which has
# the same wordmark and bar in the same places, draws over it.
#
# Both the live medium's menu and the disk's grub.cfg source this file from the
# ESP (secureboot.sh, sb_esp_files) once openshell_esp names it.

# The splash, with GRUB's own lines drawn in black: they still reach the
# serial port where there is one (openshell_serial, set by the configs that
# source this file), which the tests read.
function openshell_splash {
    set gfxmode=auto
    if terminal_output gfxterm $openshell_serial; then
        if background_image -m stretch ($openshell_esp)/EFI/BOOT/splash.png; then
            set color_normal=black/black
            set gfxpayload=keep
            # Draws the background now, not at GRUB's next line.
            clear
        fi
    fi
}

# Back to text, for what the person has to read (Secure Boot enrollment).
function openshell_text {
    set color_normal=light-gray/black
    set gfxpayload=
    terminal_output console $openshell_serial
}
