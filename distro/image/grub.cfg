# OpenShell Native: which system slot boots. The A/B transaction
# (distro/ab) keeps a summary for GRUB in the data partition, a GRUB
# environment block (distro/ab/src/bootenv.rs):
#
#   openshell_fallback  the confirmed slot (a or b), or recovery
#   openshell_trial     the slot on trial, if any
#   openshell_tries     its attempts left, as a run of 1s
#
# A trial with attempts left boots and loses one first, saved before the
# handover; GRUB has no arithmetic, so regexp takes a 1 off. Otherwise the
# confirmed slot boots, and without a readable environment the recovery.
# The booted system reads back what was recorded (openshell-ab booted).
#
# Each slot carries its boot command, boot.cfg, with the kernel command line
# of its release; openshell.slot tells the system which slot it is.
#
# The ESP this GRUB started from holds the boot splash (splash.cfg) and the
# MokManager; without a boot path from the firmware, the first ESP with them.

set timeout=0
set timeout_style=hidden
serial --unit=0 --speed=115200
terminal_output console serial
set openshell_esp=
regexp --set=1:openshell_esp '^\(([^)]*)\)' "$cmdpath"
if [ -z "$openshell_esp" ]; then
    search --no-floppy --file --set=openshell_esp /EFI/BOOT/mmx64.efi
fi
if source ($openshell_esp)/EFI/BOOT/splash.cfg; then
    openshell_splash
fi

set openshell_fallback=recovery
set openshell_trial=
set openshell_tries=
search --no-floppy --fs-uuid --set=openshell_data $openshell_data_uuid
if [ -n "$openshell_data" ]; then
    set openshell_env=($openshell_data)/openshell/ab/grubenv
    load_env --file $openshell_env openshell_fallback openshell_trial openshell_tries
fi

set openshell_slot=$openshell_fallback
if [ "$openshell_trial" = a -o "$openshell_trial" = b ]; then
    if regexp --set=1:openshell_tries '^1(1*)$' "$openshell_tries"; then
        if save_env --file $openshell_env openshell_tries; then
            set openshell_slot=$openshell_trial
        else
            echo "OpenShell Native: could not record the trial attempt"
        fi
    fi
fi

set root=
if [ "$openshell_slot" = a ]; then
    search --no-floppy --fs-uuid --set=root $openshell_system_a_uuid
elif [ "$openshell_slot" = b ]; then
    search --no-floppy --fs-uuid --set=root $openshell_system_b_uuid
fi
if [ -z "$root" -o ! -f "($root)/boot.cfg" ]; then
    set openshell_slot=recovery
    search --no-floppy --fs-uuid --set=root $openshell_recovery_uuid
fi
echo "OpenShell Native: booting $openshell_slot"
if source ($root)/boot.cfg; then
    boot
fi
if [ "$openshell_slot" != recovery ]; then
    set openshell_slot=recovery
    if search --no-floppy --fs-uuid --set=root $openshell_recovery_uuid; then
        echo "OpenShell Native: booting $openshell_slot"
        if source ($root)/boot.cfg; then
            boot
        fi
    fi
fi

# Nothing started. Under Secure Boot, the kernel's key is not enrolled yet:
# MokManager enrolls it from this partition (Enroll key from disk), once.
openshell_text
echo "OpenShell Native: the system did not start. With Secure Boot, enroll"
echo "ENROLL_THIS_KEY_IN_MOKMANAGER.cer in MokManager (Enroll key from disk), which opens now."
sleep 10
set root=$openshell_esp
chainloader ($openshell_esp)/EFI/BOOT/mmx64.efi
boot
